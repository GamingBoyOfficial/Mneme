[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mneme-memory"
version = "0.1.1"
description = "Portable memory layer for AI agents. Structured, consolidating, forgettable memory that works across any framework."
readme = "../../README.md"
authors = [{ name = "Parikshit Sharma", email = "214552650+GamingBoyOfficial@users.noreply.github.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["ai", "memory", "agents", "semantic-search", "portability", "rust", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
homepage = "https://github.com/GamingBoyOfficial/Mneme"
repository = "https://github.com/GamingBoyOfficial/Mneme"
documentation = "https://github.com/GamingBoyOfficial/Mneme#readme"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"