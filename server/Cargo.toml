[package]
name = "mneme-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
mneme-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
fastembed = "4"
anyhow = "1"